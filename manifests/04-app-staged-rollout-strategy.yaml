apiVersion: placement.kubernetes-fleet.io/v1
kind: StagedUpdateStrategy
metadata:
  name: app-staged-rollout-strategy
  namespace: aks-store-demo
spec:
  stages:
    - name: dev
      labelSelector:
        matchLabels:
          appgroup: dev
      afterStageTasks:
        - type: TimedWait
          waitTime: 30s
    - name: test
      labelSelector:
        matchLabels:
          appgroup: test
      afterStageTasks:
        - type: TimedWait
          waitTime: 30s
    - name: proda
      labelSelector:
        matchLabels:
          appgroup: proda
      beforeStageTasks:
        - type: Approval
    - name: prodb
      labelSelector:
        matchLabels:
          appgroup: prodb
      beforeStageTasks:
        - type: Approval